[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glomseg"
version = "1.0.0"
description = "Détection et segmentation de glomérules rénaux sur lames histologiques (U-Net, CPU)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Serigne Touba MBAYE" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scipy>=1.10",
  "pyyaml>=6",
  "tqdm>=4.60",
]

[project.optional-dependencies]
pretrained = ["segmentation-models-pytorch>=0.3"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
demo = ["gradio>=4.0"]
track = ["mlflow>=2.10"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905", "E731"]  # FastAPI File(...) ; zip sur listes de même taille ; petites lambdas
